<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Riper Stream</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="stream.js"></script>
</head>
<body class="stream">
  <div class="stream-map"><canvas id="map"></canvas></div>
  <div class="stream-side">
    <div class="stream-focus">
      <canvas id="focus"></canvas>
      <div id="focus-name" class="stream-name"></div>
      <div id="focus-epitaph" class="stream-stage"></div>
      <div id="focus-stage" class="stream-stage"></div>
    </div>
    <ul id="events" class="stream-events"></ul>
  </div>
  <div class="stream-cta">
    <span id="cta-ru"></span>
    <small id="cta-en"></small>
  </div>
</body>
</html>
