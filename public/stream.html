<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Riper Stream</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="stream.js"></script>
</head>
<body class="stream">
  <div id="map-box" class="stream-map"><canvas id="map"></canvas></div>
  <div id="camera-caption" class="camera-caption"></div>
  <div class="stream-side">
    <div class="stream-focus">
      <canvas id="focus"></canvas>
      <div id="focus-name" class="stream-name"></div>
      <div id="focus-epitaph" class="stream-stage"></div>
      <div id="focus-stage" class="stream-stage"></div>
    </div>
    <ul id="events" class="stream-events"></ul>
  </div>
  <div class="stream-cta">
    <span id="cta-ru"></span>
    <small id="cta-en"></small>
  </div>
  <div id="band-screen" class="band-screen band-stage" hidden>
    <canvas id="band-canvas"></canvas>
    <div id="band-bubbles" class="band-bubbles"></div>
  </div>
  <div id="board-screen" class="board-screen" hidden>
    <h2 id="board-title"></h2>
    <div id="board-content" class="board-view"></div>
  </div>
</body>
</html>
